name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verifica formatação (gofmt)
        run: |
          fora=$(gofmt -l .)
          if [ -n "$fora" ]; then
            echo "Arquivos fora do gofmt:"
            echo "$fora"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go fix (falha se houver modernização pendente)
        run: go fix -diff ./...

      - name: go build
        run: go build ./...

      # A versão vem do go.mod (diretiva tool), então o Dependabot a acompanha
      - name: staticcheck
        run: go tool staticcheck ./...

  race:
    name: Testes e exemplos com detector de corrida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Testes (Example de cada pasta) com -race
        run: go test -race ./...

      - name: Executa cada exemplo com -race
        run: |
          set -euo pipefail
          # Toda pasta com um main é um exemplo: nenhuma fica de fora por esquecimento
          for dir in */; do
            dir=${dir%/}
            ls "$dir"/*.go > /dev/null 2>&1 || continue
            echo "::group::$dir"
            timeout 90s go run -race ./"$dir"/ > /dev/null
            echo "::endgroup::"
          done
